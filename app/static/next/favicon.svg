<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- the owner's Firewalla Network, the futuristic look (20 Nov 2026): the same
       idea as before, an "E" for the owner's whose arms end in network nodes on a
       shield, now as a neon outline on a dark core with a turning ring.
       It holds still for a browser set to reduce motion. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e6ff"/>
      <stop offset=".55" stop-color="#6f7dff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#17305e"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .turn { transform-origin: 32px 33px; animation: turn 12s linear infinite; }
      .node { animation: beat 1.8s ease-in-out infinite; }
      .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes beat { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .turn, .node { animation: none; } }
    </style>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070b16"/>
  <path d="M32 4 L56 12 V30 C56 45 46 55 32 61 C18 55 8 45 8 30 V12 Z" fill="url(#core)" stroke="url(#edge)" stroke-width="2.6" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M32 9 L51.5 15.5 V30 C51.5 42 43.5 50.5 32 55.5 C20.5 50.5 12.5 42 12.5 30 V15.5 Z" fill="none" stroke="#2a6ea8" stroke-width=".8" stroke-dasharray="1.5 3"/>
  <circle class="turn" cx="32" cy="33" r="19.5" fill="none" stroke="#4fd0ff" stroke-width="1" stroke-dasharray="9 5 2 5" opacity=".7"/>
  <g stroke="#e9fbff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <path d="M36 19 H24.5 V46 H36 M24.5 32.5 H33.5"/>
  </g>
  <g filter="url(#glow)">
    <circle class="node" cx="40.5" cy="19" r="3.6" fill="#22e6ff"/>
    <circle class="node n2" cx="38" cy="32.5" r="3.6" fill="#8f7bff"/>
    <circle class="node n3" cx="40.5" cy="46" r="3.6" fill="#ff4fd8"/>
  </g>
</svg>
