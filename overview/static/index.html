<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firewalla Overview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z' fill='%233b82f6'/%3E%3C/svg%3E">
<style>
:root {
    --bg: #0b0e14; --card: #141923; --raised: #1b2130; --line: #222937; --line-strong: #2f3748;
    --text: #e6ebf2; --text-2: #c3cad6; --muted: #9aa4b2; --faint: #6b7587;
    --link: #7aa7ff; --accent: #3b82f6;
    --good: #34d399; --good-bg: #10201c; --good-line: #1e4d3d; --good-text: #6ee7b7;
    --warn: #fbbf24; --warn-bg: #241e10; --warn-line: #5a4614; --warn-text: #fcd34d;
    --bad: #f87171; --bad-bg: #2a1418; --bad-line: #6b2630; --bad-text: #fca5a5;
    --bar: #2a3242;
    color-scheme: dark;
}
@media (prefers-color-scheme: light) {
    :root {
        --bg: #f4f6fa; --card: #ffffff; --raised: #f0f3f8; --line: #e1e6ee; --line-strong: #cfd6e2;
        --text: #141a24; --text-2: #364152; --muted: #5b6678; --faint: #8a94a6;
        --link: #1d5fd8; --accent: #2563eb;
        --good: #059669; --good-bg: #ecfdf5; --good-line: #a7f3d0; --good-text: #047857;
        --warn: #d97706; --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-text: #b45309;
        --bad: #dc2626; --bad-bg: #fef2f2; --bad-line: #fecaca; --bad-text: #b91c1c;
        --bar: #e3e8f0;
        color-scheme: light;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
header {
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto;
}
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.head-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#siteSelect {
    font: 600 14px system-ui, sans-serif; color: var(--text); background: var(--card);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
.updated { color: var(--muted); font-size: 13px; }
main { padding: 8px 16px 32px; max-width: 1400px; margin: 0 auto; }

.banner {
    border: 1px solid; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
    display: flex; gap: 12px; align-items: flex-start;
}
.banner .icon { font-size: 18px; line-height: 1.3; }
.banner h2 { font-size: 16px; margin: 0 0 2px; }
.banner ul { margin: 4px 0 0; padding-left: 18px; }
.banner li { margin: 2px 0; }
.good { background: var(--good-bg); border-color: var(--good-line); color: var(--good-text); }
.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
.bad  { background: var(--bad-bg);  border-color: var(--bad-line);  color: var(--bad-text); }
.banner li b { color: var(--text); font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; }
.card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.card.level-bad { border-color: var(--bad-line); }
.card.level-warn { border-color: var(--warn-line); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-head h3 { margin: 0; font-size: 18px; }
.card-head .model { color: var(--muted); font-size: 13px; }
.pill {
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 9px;
    border-radius: 999px; border: 1px solid; white-space: nowrap;
}
.problems { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.problems li { font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--raised); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat .label { color: var(--muted); font-size: 12px; }
.stat .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .value small { font-size: 13px; color: var(--muted); font-weight: 400; }
.meter { height: 4px; background: var(--bar); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter i.hot { background: var(--warn); }

.section h4 {
    margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
}
.rows { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; align-items: baseline; }
.row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.off { background: var(--faint); }
.sub { color: var(--muted); font-size: 12px; }
.checks span { font-size: 11px; margin-left: 4px; }
.checks .ok { color: var(--good); } .checks .no { color: var(--bad); } .checks .na { color: var(--faint); }
.empty { color: var(--faint); font-size: 13px; }
.open { margin-top: auto; padding-top: 4px; font-size: 14px; font-weight: 600; }
@media (max-width: 480px) {
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stat .value { font-size: 17px; }
}
</style>
</head>
<body>
<header>
    <h1>Firewalla Overview</h1>
    <div class="head-right">
        <select id="siteSelect" aria-label="Firewalla" hidden></select>
        <span class="updated" id="updated">Loading…</span>
    </div>
</header>
<main>
    <div id="banner"></div>
    <div class="grid" id="grid"></div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const STATE = {live: ["LIVE", "good"], stale: ["STALE", "warn"], offline: ["OFFLINE", "bad"], waiting: ["WAITING", "warn"]};

function bytes(n) {
    if (!n) return "0 B";
    const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return `${n.toFixed(n < 10 && i ? 1 : 0)} ${u[i]}`;
}
function ago(ts, now) {
    if (!ts) return "";
    const s = Math.max(0, now - ts);
    if (s < 90) return `${Math.round(s)} s ago`;
    if (s < 5400) return `${Math.round(s / 60)} min ago`;
    if (s < 129600) return `${Math.round(s / 3600)} h ago`;
    return `${Math.round(s / 86400)} d ago`;
}
function uptime(s) {
    if (!s) return "–";
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
    return d ? `${d}d ${h}h` : `${h}h ${Math.floor((s % 3600) / 60)}m`;
}
function mbps(v) { return v == null ? "–" : v >= 100 ? v.toFixed(0) : v.toFixed(1); }

function meterStat(label, value, warnAt) {
    if (value == null) return `<div class="stat"><div class="label">${label}</div><div class="value">–</div></div>`;
    return `<div class="stat"><div class="label">${label}</div><div class="value">${Math.round(value)}<small>%</small></div>
        <div class="meter"><i class="${value >= warnAt ? "hot" : ""}" style="width:${Math.min(100, value)}%"></i></div></div>`;
}

function checks(c, active) {
    // A standby line often fails some checks while idle: grey, not red.
    return `<span class="checks">${["ping", "dns", "http"].map((k) => {
        const v = c[k]; const cls = v === true ? "ok" : v === false && active ? "no" : "na";
        return `<span class="${cls}" title="${k.toUpperCase()} ${v === true ? "OK" : v === false ? "failing" : "not tested"}">${k.toUpperCase()}${v === true ? "✓" : v === false ? "✗" : "–"}</span>`;
    }).join("")}</span>`;
}

function card(s, now) {
    const [label, lvl] = STATE[s.state] || ["?", "warn"];
    let html = `<div class="card level-${esc(s.level)}">
        <div class="card-head"><div><h3>${esc(s.name)}</h3><div class="model">${esc(s.model || "")}</div></div>
        <span class="pill ${lvl}">${label}</span></div>`;
    if (s.problems && s.problems.length) {
        html += `<ul class="problems">${s.problems.map((p) => `<li class="${esc(p.level)}">${esc(p.text)}</li>`).join("")}</ul>`;
    }
    if (!s.reachable) {
        html += `<a class="open" href="${esc(s.page)}">Open ${esc(s.name)} dashboard →</a></div>`;
        return html;
    }
    const r = s.router || {}, d = s.devices || {};
    html += `<div class="stats">
        <div class="stat"><div class="label">Devices online</div><div class="value">${d.online ?? "–"}<small> / ${d.total ?? "–"}</small></div></div>
        ${meterStat("Router CPU", r.cpu, 90)}
        ${meterStat("Router memory", r.memory, 90)}
    </div>`;

    const inet = s.internet || {};
    html += `<div class="section"><h4>Internet${(inet.wans || []).length > 1 ? " · dual WAN" : ""}</h4><div class="rows">`;
    html += (inet.wans || []).map((w) => {
        const dot = !w.ready || w.carrier === false ? (w.role === "primary" ? "bad" : "warn") : w.healthy ? (w.active ? "good" : "off") : "warn";
        return `<div class="row"><span class="name"><span class="dot ${dot}"></span>${esc(w.name)}
            <span class="sub">${w.active ? "in use" : esc(w.role || "standby")}${w.public_ip ? " · " + esc(w.public_ip) : ""}</span></span>
            <span class="right">${checks(w.checks || {}, w.active)}</span></div>`;
    }).join("") || `<div class="empty">No WAN data yet</div>`;
    html += `</div></div>`;

    const a = s.alarms || {};
    html += `<div class="section"><h4>Alarms</h4><div class="rows">
        <div class="row"><span class="name">MSP alarms active</span><span class="right">${a.msp_active}${a.msp_critical ? ` (${a.msp_critical} critical)` : ""}</span></div>
        <div class="row"><span class="name">New connections to look at</span><span class="right">${a.outbound_attention}</span></div>
        <div class="row"><span class="name">Watched devices offline</span><span class="right">${a.offline_devices}</span></div>
    </div></div>`;

    html += `<div class="section"><h4>Site-to-site VPN</h4><div class="rows">`;
    html += (s.vpns || []).map((v) => `<div class="row"><span class="name"><span class="dot ${v.connected ? "good" : "off"}"></span>${esc(v.name)}</span>
        <span class="right">${v.connected ? "up" : "down"}</span></div>`).join("") || `<div class="empty">None</div>`;
    html += `</div></div>`;

    html += `<div class="section"><h4>Latest speed test</h4><div class="rows">`;
    html += (s.speedtests || []).map((t) => `<div class="row"><span class="name">${esc(t.wan)} <span class="sub">${ago(t.at, now)}</span></span>
        <span class="right">↓ ${mbps(t.down)} · ↑ ${mbps(t.up)} Mbps${t.latency != null ? ` · ${Math.round(t.latency)} ms` : ""}</span></div>`).join("") || `<div class="empty">No speed tests yet</div>`;
    html += `</div></div>`;

    const win = s.flow_window_seconds ? Math.round(s.flow_window_seconds / 60) : 5;
    html += `<div class="section"><h4>Top networks · last ${win} min</h4><div class="rows">`;
    html += (s.top_networks || []).map((n) => `<div class="row"><span class="name">${esc(n.name)}</span><span class="right">${bytes(n.bytes)}</span></div>`).join("") || `<div class="empty">No traffic seen</div>`;
    html += `</div></div>`;

    html += `<div class="sub">Router up ${uptime(r.uptime_seconds)}</div>`;
    html += `<a class="open" href="${esc(s.page)}">Open ${esc(s.name)} dashboard →</a></div>`;
    return html;
}

function banner(sites) {
    const items = [];
    for (const s of sites) for (const p of s.problems || []) items.push([p.level, s.name, p.text]);
    if (!items.length) {
        return `<div class="banner good"><span class="icon">✓</span><div><h2>All good</h2>
            All ${sites.length} Firewalla${sites.length === 1 ? " is" : "s are"} live with nothing that needs you.</div></div>`;
    }
    const level = items.some((i) => i[0] === "bad") ? "bad" : "warn";
    items.sort((x, y) => (x[0] === "bad" ? 0 : 1) - (y[0] === "bad" ? 0 : 1));
    return `<div class="banner ${level}"><span class="icon">${level === "bad" ? "✗" : "!"}</span><div>
        <h2>${items.length} thing${items.length === 1 ? "" : "s"} to look at</h2>
        <ul>${items.map((i) => `<li><b>${esc(i[1])}:</b> ${esc(i[2])}</li>`).join("")}</ul></div></div>`;
}

let pollMs = 10000, lastOk = 0;
async function refresh() {
    try {
        const r = await fetch("api/overview", {cache: "no-store"});
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        pollMs = Math.max(5, data.poll_seconds || 10) * 1000;
        lastOk = Date.now();
        $("banner").innerHTML = banner(data.sites);
        $("grid").innerHTML = data.sites.map((s) => card(s, data.server_now)).join("");
        $("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;
        const worst = data.sites.some((s) => s.level === "bad") ? "✗ " : data.sites.some((s) => s.level === "warn") ? "! " : "";
        document.title = `${worst}Firewalla Overview`;
    } catch (e) {
        $("updated").textContent = lastOk ? `Overview not answering since ${new Date(lastOk).toLocaleTimeString()}` : "Overview not answering";
    }
    setTimeout(refresh, pollMs);
}
refresh();

// Selector (when served by the gateway): pick a router to open its full
// dashboard, or stay here on "All Firewallas".
fetch("/_fw/sites.json", {cache: "no-cache"}).then((r) => r.ok ? r.json() : []).then((sites) => {
    if (!Array.isArray(sites) || !sites.length) return;
    const sel = $("siteSelect");
    for (const s of sites) sel.add(new Option(s.name, s.id));
    sel.add(new Option("All Firewallas (overview)", "", true, true));
    sel.hidden = false;
    sel.addEventListener("change", () => { if (sel.value) location.href = "/site/" + encodeURIComponent(sel.value); });
}).catch(() => {});
</script>
</body>
</html>
