# Firewalla gateway: one address for every dashboard copy.
#
# Each request goes to the copy chosen by the "fwsite" cookie, so the full
# dashboard runs unchanged (it uses absolute paths: /next, /api/..., /static/...).
#   /site/<id>  sets the cookie and opens /next      (the selector uses this)
#   /all/       the Firewalla Overview (all routers on one page)
#   /_fw/       the selector script and the site list
# A new router: add a line to the map below and to the /site/ pattern, add it
# to sites.json, and add its network in compose.yaml.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;

    # Docker's own DNS, so container names resolve (and re-resolve after a
    # copy is recreated).
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $cookie_fwsite $fw_backend {
        default fwdash-home:8080;
        home    fwdash-home:8080;
        jb      fwdash-jb:8080;
    }

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 2048;

    server {
        listen 8080;
        # Redirects keep the address the browser used (8179), not 8080.
        absolute_redirect off;

        location ~ ^/site/(home|jb)/?$ {
            add_header Set-Cookie "fwsite=$1; Path=/; Max-Age=31536000; SameSite=Lax" always;
            add_header Cache-Control "no-store" always;
            return 302 /next;
        }

        location = /all { return 302 /all/; }
        location /all/ {
            set $overview fwdash-overview:8080;
            rewrite ^/all/(.*)$ /$1 break;
            proxy_pass http://$overview;
            proxy_set_header Host $http_host;
        }

        location /_fw/ {
            alias /gateway/;
            add_header Cache-Control "no-cache" always;
        }

        location /api/ {
            proxy_pass http://$fw_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            add_header Vary "Cookie" always;
        }

        location / {
            proxy_pass http://$fw_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            # Plain replies from the copy, so the selector can be added to the
            # page; nginx gzips them on the way out instead.
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter "</body>" "<script src=\"/_fw/selector.js\"></script></body>";
            add_header Vary "Cookie" always;
        }
    }
}
